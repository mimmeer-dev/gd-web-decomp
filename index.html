<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Geometry Dash Web Decompilation</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; padding: none; }
        canvas { display: block; margin: 0 auto; }
    </style>
  <script type="module" crossorigin src="./src/game-og.js"></script>
  <script>
    // ResizeObserver catches iframe size changes that window.resize misses
    // (e.g. parent window maximize, snap, title bar drag)
    new ResizeObserver(() => {
      window.dispatchEvent(new Event('resize'));
    }).observe(document.documentElement);
  </script>
</head>

</body>
</html>
